x-chat-environment: &chat-environment
  CHAT_PORT: 4000
  DATABASE_URL: postgresql://tether:tether@postgres:5432/tether
  REDIS_URL: redis://redis:6379
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}

x-chat-service: &chat-service
  image: tether-chat:local
  environment: *chat-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tether
      POSTGRES_USER: tether
      POSTGRES_PASSWORD: tether
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tether -d tether"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: tether-chat:local
    build:
      context: .
    command:
      - sh
      - -c
      - ./node_modules/.bin/auth migrate --config src/auth.ts --yes && ./node_modules/.bin/drizzle-kit migrate
    environment: *chat-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  chat-1:
    <<: *chat-service

  chat-2:
    <<: *chat-service

  chat-3:
    <<: *chat-service

  nginx:
    image: nginx:alpine
    ports:
      - "${CHAT_PROXY_PORT:-4000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      chat-1:
        condition: service_healthy
      chat-2:
        condition: service_healthy
      chat-3:
        condition: service_healthy
    restart: unless-stopped

  integration-test:
    image: tether-chat:local
    build:
      context: .
    command: ["node", "--import", "tsx", "--test", "scripts/live-delivery.integration.test.ts"]
    environment:
      <<: *chat-environment
      CHAT_PROXY_URL: http://nginx
      CHAT_INSTANCE_ONE_URL: http://chat-1:4000
      CHAT_INSTANCE_TWO_URL: http://chat-2:4000
    depends_on:
      nginx:
        condition: service_started
    profiles: ["test"]
    restart: "no"

volumes:
  postgres-data:
